name: omniterm_large_stack
services:
  service-000:
    image: registry.example.test/omniterm/edge-proxy:1.0.0
    container_name: omniterm-large-service-000
    restart: unless-stopped
    command: /usr/local/bin/omniterm-edge-proxy --index 0 --tier 0 --workers 2
    ports:
      - "18000:8000"
    environment:
      - OMNITERM_SERVICE_NAME=service-000
      - OMNITERM_SERVICE_INDEX=0
      - OMNITERM_SERVICE_ROLE=edge-proxy
      - OMNITERM_SERVICE_TIER=0
      - OMNITERM_LOG_LEVEL=debug
      - OMNITERM_UPSTREAM_URL=http://service-001:8000/healthz
      - OMNITERM_METRICS_PATH=/var/lib/omniterm/edge-proxy/metrics-0.prom
      - OMNITERM_FEATURE_FLAGS=tier-0,role-edge-proxy,batch-0
    volumes:
      - ./data/service-000/state:/var/lib/omniterm/edge-proxy
      - ./data/service-000/cache:/var/cache/omniterm
      - ./config/service-000.conf:/etc/omniterm/edge-proxy.conf:ro
    networks:
      - omniterm-edge
  service-001:
    image: registry.example.test/omniterm/api-worker:1.1.1
    container_name: omniterm-large-service-001
    restart: always
    command: /usr/local/bin/omniterm-api-worker --index 1 --tier 1 --workers 3
    ports:
      - "18004:8000"
      - "18005:8001"
    environment:
      - OMNITERM_SERVICE_NAME=service-001
      - OMNITERM_SERVICE_INDEX=1
      - OMNITERM_SERVICE_ROLE=api-worker
      - OMNITERM_SERVICE_TIER=1
      - OMNITERM_LOG_LEVEL=info
      - OMNITERM_UPSTREAM_URL=http://service-002:8000/healthz
      - OMNITERM_METRICS_PATH=/var/lib/omniterm/api-worker/metrics-1.prom
      - OMNITERM_FEATURE_FLAGS=tier-1,role-api-worker,batch-1
    volumes:
      - ./data/service-001/state:/var/lib/omniterm/api-worker
      - ./data/service-001/cache:/var/cache/omniterm
      - ./config/service-001.conf:/etc/omniterm/api-worker.conf:ro
    networks:
      - omniterm-edge
      - omniterm-internal
