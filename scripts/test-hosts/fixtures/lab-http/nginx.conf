# Listeners for the Network Tools suite (E2eNetworkToolsTest).
#
# Two jobs, both satisfied by one server block:
#
#  1. Port-scan reachability. The suite scans 21, 22, 445, 1080, 8080, 8081, 8888 and expects every
#     one Open, plus 65500 Closed. 22 is the developer machine's own sshd, 1080/8888 are the gost
#     proxy; the four here close the remaining gaps. These are deliberately TCP listeners for a
#     connect-scan, NOT protocol servers -- nothing here speaks FTP or SMB, and no test asks it to.
#     If a suite ever needs real FTP/SMB semantics it needs real daemons, not this file.
#
#  2. A real HTTP origin for the tunnel assertions. This container joins the `direct` container's
#     network namespace (network_mode: service:direct), so 127.0.0.1:8080 *as resolved on the SSH
#     host* is this server. That is what makes both seeded port forwards work: the local forward
#     targets 127.0.0.1:8080, and the dynamic SOCKS tunnel issues CONNECT 127.0.0.1:8080 from the
#     far end. A sibling container on a shared network could not satisfy either -- both need
#     loopback on the SSH host itself.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 64;
}

http {
  access_log off;
  default_type text/plain;

  server {
    listen 8080;
    listen 8081;
    listen 21;
    listen 445;

    location / {
      return 200 "omniterm-test-http\n";
    }
  }
}
