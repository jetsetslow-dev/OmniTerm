[global]
server role = standalone server
server min protocol = SMB2
map to guest = Never
disable netbios = yes
smb ports = 445
log file = /dev/stdout
logging = file
max log size = 0

[fixture]
path = /srv/share
browseable = yes
read only = no
guest ok = no
valid users = omniterm
create mask = 0664
directory mask = 0775
