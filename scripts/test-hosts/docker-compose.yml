# Disposable SSH fixtures for local OmniTerm testing.
#
# Not fixtures for one feature: this is a small fleet whose SHAPE mirrors OmniTerm's connection
# surface, so fleet, monitoring, terminal, files, containers, tunnels, and widget flows can all be
# exercised against it. Everything is throwaway -- no state is worth keeping, and `down` discards
# the host keys so the next `up` re-exercises OmniTerm's trust-on-first-use dialog.
#
# Credentials are deliberately NOT written here. This file is committed to a public repository, and
# a literal password beside USER_PASSWORD is both a secret-scanning finding and a bad habit to copy.
# `./scripts/test-hosts.sh up` generates random per-machine values into scripts/test-hosts/.env
# (gitignored) and compose reads them from there; the `:?` syntax below fails loudly with an
# actionable message rather than silently starting a host with an empty or guessable password.
#
# Topology (ServerEntity.proxyType in Entities.kt is "none" | "http" | "socks5" | "ssh"):
#
#   host machine ──► direct    :2201   password auth, sudo, tmux   proxyType=none
#                 ├► keyauth   :2202   SSH key auth only           proxyType=none  (key path)
#                 ├► certauth  :2207   SSH certificate auth only   proxyType=none  (test CA)
#                 ├► bastion   :2203   jump host, sudo             proxyType=none
#                 └► proxy     :1080 SOCKS5, :8888 HTTP CONNECT
#
#   internal-only (NO published port, unreachable from the host by design):
#                    internal-a       reached via bastion          proxyType=ssh    (jump path)
#                                     or via proxy                 proxyType=socks5 / http
#                                     or via wireguard (UDP :51820) tunnelId  (VPN tunnel, 10.77.0.1:22)
#                                     or via the tailnet: headscale (:8085) and tailnet-router, a
#                                     subnet router for the internal network (internal-a:2222)
#
# HTTP/SOCKS5 proxies ride inside the session (JschSession.applyProxy); SSH jump uses a separate
# jump session plus a local forward (buildJumpedJschSession). internal-a is the only way to prove a
# proxy is actually carrying traffic, because it cannot be reached any other way.
#
# From an Android emulator the host machine is 10.0.2.2, so use 10.0.2.2:2201 etc.
# `internal-a` is addressed by its container name on the internal network.
#
# Usage: ./scripts/test-hosts.sh up | down | status | verify | keys
networks:
  edge:
    name: omniterm-test-edge
  internal:
    name: omniterm-test-internal
    internal: true

volumes:
  share-data:
    name: omniterm-test-share-data
  runtime-docker-run:
    name: omniterm-test-runtime-docker-run
  runtime-docker-data:
    name: omniterm-test-runtime-docker-data
  runtime-podman-data:
    name: omniterm-test-runtime-podman-data

x-ssh-common: &ssh-common
  image: lscr.io/linuxserver/openssh-server:latest
  environment: &ssh-env
    PUID: "1000"
    PGID: "1000"
    TZ: Etc/UTC
    SUDO_ACCESS: "true"
  restart: "no"

services:
  # Baseline host: password auth plus tmux, so persistent-session flows work here.
  direct:
    <<: *ssh-common
    container_name: omniterm-test-direct
    environment:
      <<: *ssh-env
      PASSWORD_ACCESS: "true"
      USER_NAME: "${OMNITERM_TEST_USER:?generate scripts/test-hosts/.env via ./scripts/test-hosts.sh up}"
      USER_PASSWORD: "${OMNITERM_TEST_PASSWORD:?generate scripts/test-hosts/.env via ./scripts/test-hosts.sh up}"
      DOCKER_MODS: linuxserver/mods:universal-package-install
      INSTALL_PACKAGES: tmux|htop|curl
    volumes:
      # The 400-service Compose stack the builder stress test edits. Mounted read-only so the test
      # cannot mutate its own input, and committed rather than generated at `up` time so every
      # contributor reads byte-identical bytes. Regenerate via ComposeLargeStackFixtureTest; see
      # AGENTS.md. It replaces a path that only existed under one contributor's home directory.
      - ./fixtures/large-stack/compose.yml:/fixtures/large-stack/compose.yml:ro
      # Without this the image refuses every -L/-D tunnel; see the script for why.
      - ./fixtures/ssh-init:/custom-cont-init.d:ro
    ports:
      - "127.0.0.1:2201:2222"
      # Published on behalf of `labhttp`, which shares this container's network namespace. A service
      # using network_mode cannot publish its own ports, so they belong to the namespace owner.
      # Port 22 is deliberately absent: the developer machine's own sshd already answers there, and
      # the Network Tools port scan expects it open.
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    networks: [edge]

  # HTTP origin + spare TCP listeners for the Network Tools suite. Joins `direct`'s network
  # namespace so it answers on the SSH host's OWN loopback, which is what the seeded local forward
  # (127.0.0.1:8080) and the dynamic SOCKS tunnel (CONNECT 127.0.0.1:8080) both dial. See
  # fixtures/lab-http/nginx.conf.
  labhttp:
    image: nginx:alpine
    container_name: omniterm-test-labhttp
    network_mode: "service:direct"
    depends_on: [direct]
    volumes:
      - ./fixtures/lab-http/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: "no"

  # One seeded writable filesystem exposed through every share protocol the apps can browse. NFS is
  # deliberately absent: both apps explain that Android cannot mount it through the in-app browser.
  # A named volume preserves edits across `up` calls; `down` remains the explicit clean reset.
  shares:
    build: ./fixtures/shares
    image: omniterm-test-shares:local
    container_name: omniterm-test-shares
    environment:
      OMNITERM_TEST_USER: "${OMNITERM_TEST_USER:?generate scripts/test-hosts/.env via ./scripts/test-hosts.sh up}"
      OMNITERM_TEST_PASSWORD: "${OMNITERM_TEST_PASSWORD:?generate scripts/test-hosts/.env via ./scripts/test-hosts.sh up}"
      OMNITERM_TEST_FTP_PASV_ADDRESS: "127.0.0.1"
    volumes:
      - share-data:/srv/share
    ports:
      - "127.0.0.1:21:21"
      - "127.0.0.1:445:445"
      - "127.0.0.1:8082:8080"
      - "127.0.0.1:21100-21110:21100-21110"
    networks: [edge]
    restart: "no"

  # An engine whose storage and socket are both fixture-owned. The SSH gateway below sees only this
  # socket, so destructive container actions can never reach the developer's personal daemon.
  runtime-docker-engine:
    image: docker:29-dind
    container_name: omniterm-test-runtime-docker-engine
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - runtime-docker-run:/var/run
      - runtime-docker-data:/var/lib/docker
    networks: [edge]
    restart: "no"

  runtime-docker:
    build:
      context: ./fixtures/runtime-host
      target: docker-host
    image: omniterm-test-runtime-docker:local
    container_name: omniterm-test-runtime-docker
    environment:
      OMNITERM_TEST_USER: "${OMNITERM_TEST_USER:?generate scripts/test-hosts/.env via ./scripts/test-hosts.sh up}"
      OMNITERM_TEST_PASSWORD: "${OMNITERM_TEST_PASSWORD:?generate scripts/test-hosts/.env via ./scripts/test-hosts.sh up}"
      # The fixture backup repositories' password; without it they are not made.
      OMNITERM_TEST_BACKUP_PASSWORD: "${OMNITERM_TEST_BACKUP_PASSWORD:-}"
    volumes:
      - runtime-docker-run:/var/run
      - ./fixtures/runtime-stack:/fixtures/runtime-stack:ro
      - ./fixtures/large-stack/compose.yml:/fixtures/large-stack.yml:ro
      - ../../app/src/test/resources/compose-corpus:/fixtures/compose-corpus:ro
    ports:
      - "127.0.0.1:2205:2222"
    networks: [edge]
    depends_on: [runtime-docker-engine]
    restart: "no"

  # Podman must be privileged only inside this disposable container so it can create its own user
  # namespaces and network. Its storage is a fixture volume and no host runtime socket is mounted.
  runtime-podman:
    build:
      context: ./fixtures/runtime-host
      target: podman-host
    image: omniterm-test-runtime-podman:local
    container_name: omniterm-test-runtime-podman
    privileged: true
    environment:
      OMNITERM_TEST_USER: "${OMNITERM_TEST_USER:?generate scripts/test-hosts/.env via ./scripts/test-hosts.sh up}"
      OMNITERM_TEST_PASSWORD: "${OMNITERM_TEST_PASSWORD:?generate scripts/test-hosts/.env via ./scripts/test-hosts.sh up}"
    volumes:
      - runtime-podman-data:/var/lib/containers
      - ./fixtures/runtime-stack:/fixtures/runtime-stack:ro
      - ./fixtures/large-stack/compose.yml:/fixtures/large-stack.yml:ro
      - ../../app/src/test/resources/compose-corpus:/fixtures/compose-corpus:ro
    ports:
      - "127.0.0.1:2206:2222"
    networks: [edge]
    restart: "no"

  # Key-only host: password auth disabled, so this exercises the private-key credential path.
  # scripts/test-hosts.sh generates the keypair into scripts/test-hosts/keys/ (gitignored).
  keyauth:
    <<: *ssh-common
    container_name: omniterm-test-keyauth
    environment:
      <<: *ssh-env
      PASSWORD_ACCESS: "false"
      USER_NAME: "${OMNITERM_TEST_USER:?generate scripts/test-hosts/.env via ./scripts/test-hosts.sh up}"
      PUBLIC_KEY_FILE: /config/testkey.pub
    volumes:
      - ./keys/omniterm_test_ed25519.pub:/config/testkey.pub:ro
    ports:
      - "127.0.0.1:2202:2222"
    networks: [edge]

  # Same as keyauth, but the client key is passphrase-protected. Separate host because a
  # passphrase failure and a wrong-key failure look identical from the app if they share a target.
  keyauth-passphrase:
    <<: *ssh-common
    container_name: omniterm-test-keyauth-passphrase
    environment:
      <<: *ssh-env
      PASSWORD_ACCESS: "false"
      USER_NAME: "${OMNITERM_TEST_USER:?generate scripts/test-hosts/.env via ./scripts/test-hosts.sh up}"
      PUBLIC_KEY_FILE: /config/testkey.pub
    volumes:
      - ./keys/omniterm_test_passphrase_ed25519.pub:/config/testkey.pub:ro
    ports:
      - "127.0.0.1:2204:2222"
    networks: [edge]

  # Certificate-only host: no authorized keys, and sshd trusts the fleet's test certificate
  # authority, so only a user certificate that CA signed gets in. scripts/test-hosts.sh generates
  # the CA and a certificate for the plain test key into keys/ (gitignored); SshSignInLiveTest signs
  # its own keys, security keys included, with the same CA. See fixtures/ssh-ca.
  certauth:
    <<: *ssh-common
    container_name: omniterm-test-certauth
    environment:
      <<: *ssh-env
      PASSWORD_ACCESS: "false"
      USER_NAME: "${OMNITERM_TEST_USER:?generate scripts/test-hosts/.env via ./scripts/test-hosts.sh up}"
    volumes:
      - ./keys/omniterm_test_ca.pub:/config/omniterm_test_ca.pub:ro
      - ./fixtures/ssh-ca:/custom-cont-init.d:ro
    ports:
      - "127.0.0.1:2207:2222"
    networks: [edge]

  # Jump host. Sits on both networks so it can reach internal-a on OmniTerm's behalf.
  bastion:
    <<: *ssh-common
    container_name: omniterm-test-bastion
    environment:
      <<: *ssh-env
      PASSWORD_ACCESS: "true"
      USER_NAME: "${OMNITERM_TEST_USER:?generate scripts/test-hosts/.env via ./scripts/test-hosts.sh up}"
      USER_PASSWORD: "${OMNITERM_TEST_PASSWORD:?generate scripts/test-hosts/.env via ./scripts/test-hosts.sh up}"
    volumes:
      # A jump host that cannot forward is not a jump host: without this the proxyType=ssh path to
      # internal-a documented above silently cannot work.
      - ./fixtures/ssh-init:/custom-cont-init.d:ro
    ports:
      - "127.0.0.1:2203:2222"
    networks: [edge, internal]

  # Reachable ONLY through bastion or proxy. No published port, and `internal: true` on the network
  # means it has no route to the host either. If the app can talk to this, the proxy path works.
  internal-a:
    <<: *ssh-common
    container_name: omniterm-test-internal-a
    environment:
      <<: *ssh-env
      PASSWORD_ACCESS: "true"
      USER_NAME: "${OMNITERM_TEST_USER:?generate scripts/test-hosts/.env via ./scripts/test-hosts.sh up}"
      USER_PASSWORD: "${OMNITERM_TEST_PASSWORD:?generate scripts/test-hosts/.env via ./scripts/test-hosts.sh up}"
    networks: [internal]

  # A private HTTPS registry for the image-update check (E2eImageUpdatesTest), reached by name on
  # the edge network only. `./scripts/test-hosts.sh registry` makes its CA and certificate
  # (.registry/, gitignored), starts it, hands the CA to the Docker and Podman fixtures and pushes
  # the images the suite reads. In its own profile, so `up` does not start it without its certificate.
  registry:
    image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    container_name: omniterm-test-registry
    profiles: [registry]
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_HTTP_TLS_CERTIFICATE: /certs/server.crt
      REGISTRY_HTTP_TLS_KEY: /certs/server.key
    volumes:
      - ./.registry:/certs:ro
    networks: [edge]
    restart: "no"

  # A read-only SNMP agent for the SNMP device suite (E2eSnmpDevicesTest): net-snmp on Alpine,
  # with a v2c community and a v3 user (SHA-256 and AES) from .env, on UDP 127.0.0.1:1161 only.
  # It also reports a UPS on battery (UPS-MIB) and has an interface with no link, for those readings.
  # NET_ADMIN only to make that interface (a veth pair) inside its own network namespace.
  # `./scripts/test-hosts.sh snmp` builds and starts it; in its own profile, so `up` does not.
  snmp-device:
    build:
      context: ./fixtures/snmp-device
    image: omniterm-test-snmp-device:local
    container_name: omniterm-test-snmp-device
    profiles: [snmp]
    cap_add: [NET_ADMIN]
    environment:
      SNMP_COMMUNITY: "${OMNITERM_TEST_SNMP_COMMUNITY:?generate scripts/test-hosts/.env via ./scripts/test-hosts.sh up}"
      SNMP_PASSWORD: "${OMNITERM_TEST_SNMP_PASSWORD:?generate scripts/test-hosts/.env via ./scripts/test-hosts.sh up}"
    ports:
      - "127.0.0.1:1161:1161/udp"
    networks: [edge]
    restart: "no"

  # A contract fake of the Proxmox VE API for the Proxmox suite (E2eProxmoxTest): the documented
  # shapes of the calls OmniTerm makes, over HTTPS with its own self-signed certificate, on
  # 127.0.0.1:8006 only. Not Proxmox: it proves OmniTerm's client. Tokens' secrets from .env.
  # Also on the internal network, which the tailnet router serves, so the suite can reach it
  # through a Tailscale tunnel at its internal address.
  # `./scripts/test-hosts.sh proxmox` builds and starts it; in its own profile, so `up` does not.
  proxmox-api:
    build:
      context: ./fixtures/proxmox-api
    image: omniterm-test-proxmox-api:local
    container_name: omniterm-test-proxmox-api
    profiles: [proxmox]
    environment:
      PVE_TOKEN_SECRET: "${OMNITERM_TEST_PVE_TOKEN:?generate scripts/test-hosts/.env via ./scripts/test-hosts.sh up}"
      PVE_AUDIT_TOKEN_SECRET: "${OMNITERM_TEST_PVE_AUDIT_TOKEN:?generate scripts/test-hosts/.env via ./scripts/test-hosts.sh up}"
    ports:
      - "127.0.0.1:8006:8006"
    networks: [edge, internal]
    restart: "no"

  # Headscale, the control server for the Tailscale tunnel suite (E2eTailscaleTunnelTest). Images
  # are pinned by digest. `./scripts/test-hosts.sh up` makes its user and auth keys (the phone's
  # goes into .env as OMNITERM_TEST_TS_PHONE_KEY), then starts the router with its own.
  headscale:
    image: headscale/headscale:0.27.1@sha256:cd37b30018575fd62f18419138d4e526bcf894e1d4e1aa1b08699cec1891ac23
    container_name: omniterm-test-headscale
    command: serve
    restart: "no"
    volumes:
      - ./fixtures/headscale/config.yaml:/etc/headscale/config.yaml:ro
      - ./.tailnet:/etc/headscale/tailnet:ro
    tmpfs:
      - /var/lib/headscale
      - /var/run/headscale
    ports:
      - "127.0.0.1:8085:8080"
    networks: [edge]

  # A tailnet node and subnet router for the internal network, in userspace mode: the phone reaches
  # internal-a through it at its internal address, port 2222, and no other way. Started by `up` once
  # its key exists, with the internal network's range (docker picks it) as its route.
  tailnet-router:
    image: tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    container_name: omniterm-test-tailnet-router
    profiles: [tailnet]
    restart: "no"
    environment:
      TS_AUTHKEY: "${OMNITERM_TEST_TS_ROUTER_KEY:-}"
      TS_EXTRA_ARGS: "--login-server=http://headscale:8080"
      TS_HOSTNAME: router
      TS_ROUTES: "${OMNITERM_TEST_TS_ROUTES:-}"
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_STATE_DIR: /var/lib/tailscale
      TS_TAILSCALED_EXTRA_ARGS: "--port=41641 --no-logs-no-support"
    tmpfs:
      - /var/lib/tailscale
    networks: [edge, internal]
    depends_on: [headscale, internal-a]

  # WireGuard peer for the VPN tunnel suite (E2eVpnTunnelTest): UDP 51820 on the host's loopback,
  # which the emulator reaches as 10.0.2.2:51820 (adb reverse carries TCP only). Inside the tunnel it
  # is 10.77.0.1 and the only route to internal-a; see fixtures/wireguard/entrypoint.sh.
  wireguard:
    build: ./fixtures/wireguard
    image: omniterm-test-wireguard:local
    container_name: omniterm-test-wireguard
    restart: "no"
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    environment:
      WG_SERVER_PRIVATE_KEY: "${OMNITERM_TEST_WG_SERVER_KEY:?generate scripts/test-hosts/.env via ./scripts/test-hosts.sh up}"
      WG_CLIENT_PUBLIC_KEY: "${OMNITERM_TEST_WG_CLIENT_PUB:?generate scripts/test-hosts/.env via ./scripts/test-hosts.sh up}"
    ports:
      - "127.0.0.1:51820:51820/udp"
    networks: [edge, internal]
    depends_on: [internal-a]

  # The sanitized endpoint the Play-review recording flows point at.
  #
  # Those flows must show a plausible production host on camera without ever exposing a real one, so
  # the container's hostname is `atlas-prod` and its account is `demo`. It exists as a fixture rather
  # than being created by `docker run` from inside the test, because that required a Docker daemon on
  # whichever lab host happened to be seeded -- `omniterm-test-direct` has tmux but no docker, which
  # is what made E2eForegroundServiceProofTest unrunnable. As a fixture it is reachable on a physical
  # device through the reverse mapping for 2299 (see ANDROID_PORTS in scripts/test-hosts.sh).
  #
  # The password comes from the generated .env like every other fixture; it is deliberately NOT
  # hard-coded here or in the test, because a throwaway credential committed to a public repository
  # is still a secret-scanning finding and still an example other people copy.
  demo:
    <<: *ssh-common
    container_name: omniterm-test-demo
    hostname: atlas-prod
    environment:
      <<: *ssh-env
      PASSWORD_ACCESS: "true"
      USER_NAME: "demo"
      USER_PASSWORD: "${OMNITERM_TEST_PASSWORD:?generate scripts/test-hosts/.env via ./scripts/test-hosts.sh up}"
    ports:
      - "127.0.0.1:2299:2222"
    networks: [edge]

  # One container serving both proxy protocols the app supports, so http and socks5 can be tested
  # without a second image. On both networks: reachable from the emulator, can dial internal-a.
  proxy:
    image: ginuerzh/gost:latest
    container_name: omniterm-test-proxy
    command: -L socks5://:1080 -L http://:8888
    ports:
      - "127.0.0.1:1080:1080"
      - "127.0.0.1:8888:8888"
    networks: [edge, internal]
    restart: "no"
