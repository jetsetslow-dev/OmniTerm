name: Set up Android Gradle
description: Install the shared JDK, Gradle, and optional Android SDK packages for CI builds.

inputs:
  install-sdk-packages:
    description: Install Android SDK packages needed by release and CodeQL builds.
    required: false
    default: "false"
  cache-read-only:
    description: Restore shared Gradle caches without publishing another job-specific cache entry.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        # Pull requests are always consumers. Release jobs opt in explicitly so the main CodeQL
        # gate remains the single canonical cache writer for a merged source revision.
        cache-read-only: ${{ inputs.cache-read-only == 'true' || github.event_name == 'pull_request' }}

    # TmuxControlIntegrationTest executes the generated wire commands against a real control
    # client. Keep this dependency in the shared setup so PR, main, and release test suites all
    # enforce the same protocol gate instead of trusting string-only fixtures.
    - name: Provide tmux protocol-test runtime
      shell: bash
      run: |
        if ! command -v tmux >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y tmux
        fi
        tmux -V
        echo "OMNITERM_REQUIRE_TMUX_INTEGRATION=true" >> "$GITHUB_ENV"

    - name: Install Android SDK packages
      if: inputs.install-sdk-packages == 'true'
      shell: bash
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
