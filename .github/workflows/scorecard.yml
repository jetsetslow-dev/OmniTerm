name: OpenSSF Scorecard

on:
  # Refresh the analysis on every merge to main, not only on PRs and the weekly cron. Without a
  # push trigger the code-scanning results on main go stale between Wednesdays, which surfaces in
  # GitHub Mobile as a "configuration file not found" status for the Scorecard category.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 3"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  analysis:
    name: Supply-chain security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # HELD at v2.4.3: v2.4.4 makes this workflow fail to START (startup_failure) on
      # pull_request runs, so the required "Supply-chain security analysis" check is never
      # reported and the PR can never merge. Bisected against main with four throwaway PRs —
      # this SHA bump alone reproduces it; editing scorecard.yml or dropping id-token: write
      # does not. v2.4.4 moves the Docker image to ghcr.io/ossf/scorecard-action:v2.4.4 (the
      # manifest pulls fine, so the container itself fails to start). Revisit on v2.4.5.
      - name: Run Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif

      - name: Retain results for inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
