name: Secret scan

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

on:
  # `migration-to-flutter` is listed alongside main because that is where the work actually happens:
  # the Kotlin->Flutter port has run to 33 commits on it without this job ever seeing them, since a
  # branch that is neither main nor a PR *to* main matches nothing here. A secret committed there
  # would first be scanned at the merge, which is the most expensive moment to find one — history is
  # already written by then, and clearing it means a rewrite rather than a fix.
  #
  # `flutter-pr-check.yml` already guards both branches; this follows it. The job takes ~16s, so
  # running it per push costs nothing worth counting.
  push:
    branches: [main, migration-to-flutter]
  pull_request:
    branches: [main, migration-to-flutter]
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan repository history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject tracked credential containers
        shell: bash
        run: |
          tracked="$(git ls-files | grep -Ei '(^|/)(google-services\.json|[^/]*(service.account|service-account)[^/]*\.json|[^/]+\.(jks|keystore|p12|pfx|pem)|[^/]*(keystore|private.key|service.account)[^/]*\.(base64|b64))$' || true)"
          if [ -n "$tracked" ]; then
            echo "Credential-like files must never be committed:" >&2
            printf '%s\n' "$tracked" >&2
            exit 1
          fi

      - name: Scan for committed secrets
        # Pin the container by immutable digest and invoke `gitleaks git` ourselves. The action's
        # push-event defaults narrow --log-opts to the pushed range, which is useful for comments
        # but is not a complete-history security gate.
        run: >-
          docker run --rm
          -v "$PWD:/repo" -w /repo
          zricethezav/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
          git --redact --no-banner --no-color /repo
