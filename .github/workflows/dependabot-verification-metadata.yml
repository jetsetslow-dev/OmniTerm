name: Dependabot verification-metadata fixup

# actions/checkout initializes a temporary repository; define its branch name so Git does not emit
# the legacy-default-branch warning on every job.
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

# Dependabot bumps dependency versions but has no way to know gradle/verification-metadata.xml
# needs new checksums for them, so every Gradle Dependabot PR can fail the "Validate release SBOM
# generation" required check with no path to green. This workflow regenerates the file and opens
# a follow-up PR with the fix.
#
# pull_request_target runs with base-branch permissions/secrets, which is normally dangerous when
# combined with checking out and building the PR's own code (a "pwn request": untrusted code runs
# with elevated permissions). This workflow deliberately never does that: it never checks out
# Dependabot's branch or ref at all. Instead it reads only gradle/libs.versions.toml from the PR
# head via the read-only Contents API, applies that file on top of a fresh checkout of main,
# regenerates checksums there, and pushes the result to a brand-new branch + PR — so no
# PR-supplied executable code or checksum assertions are ever trusted when ./gradlew runs.
on:
  pull_request_target:
    branches:
      - main
    paths:
      - "gradle/libs.versions.toml"

permissions:
  contents: read

concurrency:
  group: dependabot-verification-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fixup:
    name: Regenerate verification-metadata.xml
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/gradle/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true

      # Pull only the version catalog through the read-only Contents API — never a checkout of the
      # PR's ref/branch. Metadata starts from trusted main and is regenerated locally.
      - name: Apply the PR's version-catalog changes on top of main
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/contents/gradle/libs.versions.toml?ref=${HEAD_SHA}" \
            --jq '.content' | base64 -d > gradle/libs.versions.toml

      - name: Set up Android Gradle
        uses: ./.github/actions/setup-android-gradle
        with:
          cache-read-only: "true"

      # refresh-verification-metadata.sh resolves the same assembled debug graphs as CI. Android's
      # signing validation therefore needs a throwaway keystore even though no APK is retained.
      - name: Provide ephemeral debug keystore
        run: |
          umask 077
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -dname CN=Android-Debug -keyalg RSA -keysize 2048 -validity 1

      - name: Regenerate and strictly verify dependency metadata
        run: ./scripts/refresh-verification-metadata.sh --write

      - name: Delete ephemeral debug keystore
        if: always()
        run: rm -f debug.keystore

      - name: Open a follow-up PR with the regenerated metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- gradle/verification-metadata.xml; then
            echo "verification-metadata.xml already covers this PR's dependencies; nothing to open."
            exit 0
          fi

          fixup_branch="dependabot-verification-metadata/pr-${PR_NUMBER}"
          git checkout -b "$fixup_branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/libs.versions.toml gradle/verification-metadata.xml
          git commit -m "chore: regenerate verification-metadata.xml for dependency bump (#${PR_NUMBER})"
          git push --force origin "$fixup_branch"

          existing="$(gh pr list --head "$fixup_branch" --json number --jq '.[0].number' || true)"
          if [ -n "$existing" ]; then
            echo "Follow-up PR #$existing already open for $fixup_branch; pushed an update."
            exit 0
          fi

          gh pr create \
            --base "$PR_HEAD_REF" \
            --head "$fixup_branch" \
            --title "chore: regenerate verification-metadata.xml for #${PR_NUMBER}" \
            --body "Adds the checksums Dependabot PR #${PR_NUMBER} needs to pass the required \"Validate release SBOM generation\" check. Generated by regenerating against main plus this PR's version-catalog changes — no other file from the PR was read or executed. Merge this into #${PR_NUMBER}'s branch, or merge #${PR_NUMBER} directly if it prefers to carry this diff itself."
