name: iOS Shared Check

on:
  pull_request:
    branches:
      - main
    paths:
      - "shared/**"
      - "iosApp/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "scripts/setup-ios-dev.sh"
      - ".github/workflows/ios-pr-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shared-ios:
    name: Build shared iOS framework
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Record Apple toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Run shared tests and compile Apple framework
        run: >-
          ./gradlew
          :shared:allTests
          :shared:linkDebugFrameworkIosSimulatorArm64
          --no-daemon --no-configuration-cache
          -Dorg.gradle.jvmargs=-Xmx4g

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate --spec iosApp/project.yml

      - name: Build and test iOS shell
        run: |
          set -euo pipefail
          xcodebuild \
            -project iosApp/OmniTerm.xcodeproj \
            -scheme OmniTerm \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            test
