# XcodeGen spec for the iOS app. Generate the project with `xcodegen generate --spec iosApp/project.yml`;
# OmniTerm.xcodeproj is not committed.
name: OmniTerm
options:
  bundleIdPrefix: com.jetsetslow.omniterm
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "$(OMNITERM_APPLE_TEAM_ID)"
    # Gradle builds the shared framework into this folder for each configuration and SDK.
    FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"]
    OTHER_LDFLAGS: ["$(inherited)", "-framework", "OmniTermShared"]
    # The Gradle build phase writes outside the sandbox Xcode gives build scripts.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  OmniTerm:
    type: application
    platform: iOS
    sources:
      - path: OmniTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jetsetslow.omniterm.ios
        INFOPLIST_FILE: OmniTerm/Info.plist
    preBuildScripts:
      - name: Build shared framework
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
  OmniTermTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OmniTermTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: OmniTerm
schemes:
  OmniTerm:
    build:
      targets:
        OmniTerm: all
        OmniTermTests: [test]
    test:
      targets:
        - OmniTermTests
