name: OmniTerm
options:
  bundleIdPrefix: com.jetsetslow.omniterm
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "$(OMNITERM_APPLE_TEAM_ID)"
    CODE_SIGN_STYLE: Automatic
targets:
  OmniTerm:
    type: application
    platform: iOS
    sources:
      - path: OmniTerm
    info:
      path: OmniTerm/Info.plist
      properties:
        CFBundleDisplayName: OmniTerm
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: OmniTerm connects directly to servers you configure.
        NSFaceIDUsageDescription: Face ID can unlock OmniTerm and protect saved credentials.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jetsetslow.omniterm.ios
    preBuildScripts:
      - name: Build shared framework
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode --no-daemon
    dependencies:
      - framework: ../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)/OmniTermShared.framework
        embed: true
        codeSign: true
  OmniTermTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OmniTermTests
    dependencies:
      - target: OmniTerm
schemes:
  OmniTerm:
    build:
      targets:
        OmniTerm: all
        OmniTermTests: [test]
    test:
      targets:
        - OmniTermTests
